[build-system]
requires = [
    "setuptools>=80.9.0,<82",
]
build-backend = "setuptools.build_meta"

[project]
name = "docassemble.FaxCoverSheetTest"
version = "0.0.1"
description = "A docassemble project for FaxCoverSheet."
readme = "README.md"
authors = [
    { name = "Quinten Steenhuis", email = "qsteenhuis@suffolk.edu" },
]
dependencies = [
    "docassemble.ALAnyState @ git+https://github.com/SuffolkLITLab/docassemble-ALAnyState@main",
    "docassemble.AssemblyLine @ git+https://github.com/SuffolkLITLab/docassemble-AssemblyLine.git@main",
    "docassemble.MassAccess @ git+https://github.com/SuffolkLITLab/docassemble-MassAccess@main",
]
license = "MIT"
license-files = [
    "LICENSE",
]

[project.urls]
Homepage = "https://docassemble.org"

[tool.setuptools.packages.find]
where = [
    ".",
]
